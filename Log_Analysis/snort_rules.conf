# 增加易导致误报和漏报的规则（符合传统Snort特点）
alert tcp any any -> any 80 (msg:"SQL注入特征"; content:"union select"; rev:1;)
alert tcp any any -> any 80 (msg:"XSS尝试"; content:"<script>"; rev:2;)
alert tcp any any -> any 80 (msg:"敏感文件访问"; content:"/etc/passwd"; rev:3;)
alert tcp any any -> any 80 (msg:"异常参数"; content:"=../"; rev:4;)
# 增加泛化规则（提高召回率但增加误报）
alert tcp any any -> any any (msg:"可疑User-Agent"; content:"bot"; rev:5;)
alert tcp any any -> any any (msg:"POST请求异常长度"; content:"Content-Length: 10000"; rev:6;)